<body>
  <nav class="nav">
    <a class="logo" href="index.html">QuantLab</a>
    <div class="nav-links">
      <a href="index.html">首页</a>

      <a href="strategies.html">策略说明</a>
    </div>
  </nav>
  <main class="container">
    <div class="grid">
      <section class="card">
        <h2>双均线策略</h2>
        <p class="note">计算短周期均线和长周期均线。短均线上穿长均线时买入，短均线下穿长均线时卖出。适合展示趋势跟踪思想。</p>
      </section>
      <section class="card">
        <h2>定投策略</h2>
        <p class="note">每隔固定交易日买入固定金额，不判断短期涨跌。适合与择时策略对比，观察长期投入效果。</p>
      </section>
      <section class="card">
        <h2>RSI 策略</h2>
        <p class="note">RSI 低于超卖阈值时买入，高于超买阈值时卖出。适合展示均值回归类指标。</p>
      </section>
      <section class="card">
        <h2>指标解释</h2>
        <p class="note">总收益率衡量最终赚亏；年化收益率便于跨周期比较；最大回撤衡量历史最深亏损；夏普比率衡量单位波动对应收益；胜率统计已完成交易中盈利交易比例。</p>
      </section>
    </div>
  </main>
</body>
